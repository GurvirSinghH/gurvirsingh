<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Gurvir Singh" />
    <meta name="color-scheme" content="light" />
    <script>
      // The site is light by default. Apply dark mode, if it was picked with the navbar
      // toggle, before the page is drawn, so there is no flash of light mode first
      // (see src/components/ThemeToggle.tsx).
      try {
        if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--page-meta:start-->
    <!-- Replaced per page by scripts/prerender.mjs with the title, description, canonical
         and Open Graph tags from src/lib/pageMeta.ts. This title is only seen in dev. -->
    <title>Gurvir Singh — AI &amp; Data Science</title>
    <!--page-meta:end-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
